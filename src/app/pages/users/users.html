<div class="container mt-5 ">

  <!-- 🟦 Título principal de la página -->
  <h2 class="text-center mb-5">LISTA DE USUARIOS</h2>

  <!-- 🟦 Contenedor centrado de la tabla -->
  <div class="d-flex justify-content-center">

    <!-- 🟦 Tabla con estilos de Bootstrap -->
    <table class="table table-striped table-bordered w-70 shadow-sm">

      <!-- 🟦 Encabezados de la tabla -->
      <thead class="table-primary text-center">
        <tr>
          <th scope="col">Nombre</th>
          <th scope="col">Email</th>
          <th scope="col">Acciones</th>
        </tr>
      </thead>

      <!-- 🟦 Cuerpo de la tabla, se llena con *ngFor -->
      <tbody>
        <!-- 🔁 Recorre la lista de usuarios -->
        <tr *ngFor="let u of users">

          <!-- 📌 Nombre del usuario -->
          <td class="text-center">{{ u.name }}</td>

          <!-- 📌 Email del usuario -->
          <td class="text-center">{{ u.email }}</td>

          <!-- 📌 Botones de acción -->
          <td class="text-center btn d-flex justify-content-center gap-3">

            <!-- ✏️ Botón para editar usuario -->
            <button class="btn btn-primary px-3 py-1 rounded-pill" [routerLink]="['/user-form', u.id]">
              Editar
            </button>

            <!-- 🗑️ Botón para abrir modal de confirmación -->
            <button class="btn btn-danger px-3 py-1 rounded-pill" (click)="confirmDlete(u.id!)">
              Eliminar
            </button>

          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- 🟩 Botón para crear un nuevo usuario -->
  <div class="text-center mt-5">
    <button class="btn btn-success px-5 py-2 rounded-pill" routerLink="/user-form">
      Crear nuevo
    </button>
  </div>

</div>



<!-- 🟥 Modal de usuario eliminado -->
@if (modalDeleted) {
<div class="modal-overlay" id="successModal">
  <div class="modal-content">

    <!-- ✔ Icono visual -->
    <div class="icon-container">
      <span class="icon-check">&#10003;</span>
    </div>

    <h2 class="modal-title">¡Eliminado!</h2>

    <!-- 📌 Muestra el nombre del usuario eliminado y mensaje del backend -->
    <p class="modal-message">
      El usuario <strong style="color: rgb(223, 0, 0);">
        {{ userNameModal }}
      </strong> {{ datos.message }}
    </p>

    <!-- 🔘 Cerrar modal -->
    <button class="modal-button " (click)="closeModal()">Continuar</button>
  </div>
</div>
}



<!-- 🟧 Modal de confirmación para eliminar -->
@if (modalConfirmDelete) {
<div class="modal-overlay" id="successModal">
  <div class="modal-content">

    <!-- ✔ Icono visual -->
    <div class="icon-container">
      <span class="icon-check">&#10003;</span>
    </div>

    <h2 class="modal-title">¿Está seguro de eliminar?</h2>

    <!-- 📌 Pregunta mostrando el nombre del usuario seleccionado -->
    <p class="modal-message">
      Al usuario <strong style="color: rgb(223, 0, 0);">
        {{ userNameModal }}
      </strong>.
    </p>

    <!-- 🔴 Botón que ejecuta las acciones de eliminación y de cancelación -->
    <div class="button-container">
      <!-- 🔴 Botón que ejecuta la eliminación -->
      <button class="modal-button " (click)="deleteUser(userSelectionedId)">Continuar</button>

      <!-- ⚪ Botón para cancelar -->
      <button class="modal-button cancelar" (click)="closeModal()">Cancelar</button>
    </div>
  </div>
</div>
}

<div class="container mt-5 ">

  <h2 class="text-center mb-5">LISTA DE USUARIOS</h2>

  <div class="d-flex justify-content-center">
    <table class="table table-striped  table-bordered w-70 shadow-sm">
      <thead class="table-primary text-center">
        <tr>
          <th scope="col">Nombre</th>
          <th scope="col" >Email</th>
          <th scope="col" >Acciones</th>
        </tr>
      </thead>

      <tbody class="">
        <tr *ngFor="let u of users">
          <td class="text-center">{{ u.name }}</td>
          <td class="text-center">{{ u.email }}</td>
          
          <td class="text-center">
            <button  class="btn btn-primary px-3  me-2 py-1 rounded-pill"
            [routerLink]="['/user-form', u.id]">
              Editar
            </button>

            <button class="btn btn-danger px-3  py-1 rounded-pill" 
            (click)="deleteUser(u.id!)">
              Eliminar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="text-center mt-5">
    <button class="btn btn-success  px-5 py-2 rounded-pill" routerLink="/user-form">
      Crear nuevo
    </button>
  </div>

</div>

<div *ngIf="ModalDeleted" class="modal-overlay" id="successModal">
  <div class="modal-content">
    <div class="icon-container">
      <span class="icon-check">&#10003;</span>
    </div>

    <h2 class="modal-title">¡Eliminado!</h2>

    <p class="modal-message">
      El usuario <strong style="color: rgb(223, 0, 0);">{{ userNameModal }}</strong>
      fue eliminado exitosamente.
    </p>
<button class="modal-button" (click)="closeModal()">Continuar</button>

  </div>
</div>
